name: Generate Task 001 lockfile

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/generate-task-001-lockfile.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: task/001-project-foundation

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Apply non-workflow reproducibility fixes
        run: |
          sed -i '/^package-lock\.json$/d' .prettierignore
          npm pkg set 'scripts.format=prettier --write . --ignore-unknown'
          npm pkg set 'scripts.format:check=prettier --check . --ignore-unknown'

      - name: Capture formatting result
        id: format
        continue-on-error: true
        run: |
          set -o pipefail
          npm run format 2>&1 | tee task-001-format.log

      - name: Commit diagnostic state
        if: steps.format.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/
          git commit -m "chore: capture Task 001 formatting diagnostic"
          git push origin HEAD:task/001-project-foundation

      - name: Stop after diagnostic capture
        if: steps.format.outcome == 'failure'
        run: exit 1

      - name: Remove diagnostic log
        if: steps.format.outcome == 'success'
        run: rm task-001-format.log

      - name: Verify clean install
        if: steps.format.outcome == 'success'
        run: npm ci

      - name: Verify quality gates
        if: steps.format.outcome == 'success'
        run: npm run check

      - name: Commit verified non-workflow changes
        if: steps.format.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/
          git commit -m "fix: make dependency installs reproducible"
          git push origin HEAD:task/001-project-foundation
