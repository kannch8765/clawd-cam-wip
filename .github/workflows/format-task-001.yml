name: Format Task 001 foundation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/format-task-001.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: task/001-project-foundation

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install locked dependencies
        run: npm ci

      - name: Format and verify
        run: |
          npm run format
          npm run check

      - name: Export formatted workflow text
        run: |
          cp .github/workflows/ci.yml task-001-ci.formatted.yml
          cp .github/workflows/deploy-pages.yml task-001-deploy-pages.formatted.yml

      - name: Commit formatted non-workflow files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/
          git commit -m "style: normalize Task 001 foundation"
          git push origin HEAD:task/001-project-foundation
